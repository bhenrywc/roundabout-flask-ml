<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roundabout Lane Type Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container">
        <section class="hero">
            <h1>Roundabout Lane Type Predictor</h1>
            <p>Enter basic roundabout details to predict whether it is likely to be single-lane or multilane.</p>
        </section>

        <form method="POST" class="card">
            <label>Country</label>
            <select name="country" required>
                {% for item in options.countries %}
                <option value="{{ item }}" {% if item == 'United States' %}selected{% endif %}>{{ item }}</option>
                {% endfor %}
            </select>

            <label>State / Region</label>
            <input type="text" name="state_region" value="Georgia" required>

            <label>Roundabout Type</label>
            <select name="type" required>
                {% for item in options.types %}
                <option value="{{ item }}">{{ item }}</option>
                {% endfor %}
            </select>

            <label>Status</label>
            <select name="status" required>
                {% for item in options.statuses %}
                <option value="{{ item }}" {% if item == 'Existing' %}selected{% endif %}>{{ item }}</option>
                {% endfor %}
            </select>

            <div class="grid">
                <div>
                    <label>Year Completed</label>
                    <input type="number" name="year_completed" value="2018" min="1900" max="2035" required>
                </div>
                <div>
                    <label>Approaches</label>
                    <input type="number" name="approaches" value="4" min="1" max="10" required>
                </div>
                <div>
                    <label>Driveways</label>
                    <input type="number" name="driveways" value="0" min="0" max="20" required>
                </div>
            </div>

            <label>Functional Class</label>
            <select name="functional_class" required>
                {% for item in options.functional_classes %}
                <option value="{{ item }}">{{ item }}</option>
                {% endfor %}
            </select>

            <label>Control Type</label>
            <select name="control_type" required>
                {% for item in options.control_types %}
                <option value="{{ item }}">{{ item }}</option>
                {% endfor %}
            </select>

            <label>Previous Control Type</label>
            <select name="previous_control_type" required>
                {% for item in options.previous_control_types %}
                <option value="{{ item }}">{{ item }}</option>
                {% endfor %}
            </select>

            <button type="submit">Predict Lane Type</button>
        </form>

        {% if prediction %}
        <section class="result">
            <h2>Prediction: {{ prediction }}</h2>
            {% if confidence %}
            <p>Model confidence: {{ confidence }}%</p>
            {% endif %}
        </section>
        {% endif %}
    </main>
</body>
</html>
